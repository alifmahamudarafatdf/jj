<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-88">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DarkFish - P2P Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            font-family: 'Inter', sans-serif;
            background: #0a0c10;
            color: #fff;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }
        
        /* Animated Background */
        .bg-gradient {
            background: radial-gradient(circle at 20% 30%, #1e293b, #0a0c10 80%);
            position: relative;
        }
        
        .bg-gradient::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBkPSJNMjAgMTBhMTAgMTAgMCAwIDEgMCAyMCAxMCAxMCAwIDAgMSAwLTEweiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDU5LDEzMCwyNDYsMC4wMykiIHN0cm9rZS13aWR0aD0iMSIvPjwvc3ZnPg==') repeat;
            pointer-events: none;
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(20, 25, 35, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        .glass-light {
            background: rgba(30, 35, 45, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        
        /* Message Bubbles */
        .bubble-mine {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-radius: 20px 20px 4px 20px;
            padding: 10px 14px;
            max-width: 80%;
            color: white;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }
        
        .bubble-theirs {
            background: #262f3d;
            border-radius: 20px 20px 20px 4px;
            padding: 10px 14px;
            max-width: 80%;
            color: white;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        /* Image Messages */
        .msg-image {
            max-width: 200px;
            max-height: 250px;
            border-radius: 16px;
            cursor: pointer;
        }
        
        /* Sidebar - Perfect for all phones */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            background: #0f1219;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar.open {
            transform: translateX(0);
        }
        
        @media (min-width: 1024px) {
            .sidebar {
                position: relative;
                transform: translateX(0);
                width: 280px;
            }
        }
        
        /* For very small phones */
        @media (max-width: 360px) {
            .sidebar {
                width: 260px;
            }
        }
        
        /* Overlay */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* Peer Cards - Fixed sizing */
        .peer-card {
            background: rgba(30, 35, 45, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .peer-card:active {
            background: rgba(40, 48, 64, 0.8);
        }
        
        .peer-card.active {
            background: rgba(37, 99, 235, 0.15);
            border-color: rgba(59, 130, 246, 0.5);
        }
        
        .peer-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }
        
        /* Status Dots */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status-online { 
            background: #10b981; 
            box-shadow: 0 0 8px #10b981;
        }
        
        .status-offline { background: #6b7280; }
        
        /* Input Fields */
        .premium-input {
            background: rgba(30, 35, 45, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            width: 100%;
        }
        
        .premium-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        /* Buttons */
        .premium-button {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border: none;
            border-radius: 24px;
            padding: 12px 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .premium-button:active {
            transform: scale(0.97);
        }
        
        .premium-button-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 14px;
        }
        
        .premium-button-secondary:active {
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* Setup Screen */
        .setup-container {
            background: rgba(10, 12, 18, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 24px 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* Profile Upload */
        .pfp-upload {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
            cursor: pointer;
        }
        
        .pfp-upload img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            padding: 2px;
        }
        
        .pfp-upload-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #2563eb;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0a0c12;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: #262f3d;
            border-radius: 20px;
            width: fit-content;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }
        
        /* Message Input Area */
        .message-input-container {
            background: rgba(30, 35, 45, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 14px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        
        .attach-btn, .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .send-btn {
            background: #2563eb;
            border: none;
        }
        
        .attach-btn:active, .send-btn:active {
            transform: scale(0.95);
        }
        
        /* Mobile Menu Button */
        .mobile-menu-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }
        
        @media (min-width: 1024px) {
            .mobile-menu-btn {
                display: none;
            }
        }
        
        /* Chat Header - Fixed alignment */
        .chat-header {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 70px;
        }
        
        .chat-header img {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
        }
        
        .chat-header-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-header-info h2 {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        
        .chat-header-status span {
            font-size: 12px;
            color: #94a3b8;
        }
        
        /* Chat Window */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        /* Placeholder - Perfect centering */
        #chat-placeholder {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }
        
        #chat-placeholder .icon {
            width: 64px;
            height: 64px;
            background: rgba(30, 35, 45, 0.6);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        
        #chat-placeholder h3 {
            font-size: 18px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        
        #chat-placeholder p {
            font-size: 14px;
            color: #64748b;
            max-width: 260px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        /* Safe Area */
        @supports (padding: max(0px)) {
            .safe-top {
                padding-top: max(12px, env(safe-area-inset-top));
            }
            .safe-bottom {
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
        }
        
        /* Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        
        .modal-content {
            background: #1a1f2c;
            border-radius: 28px;
            padding: 24px 20px;
            width: 90%;
            max-width: 320px;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1a1f2c;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 500;
            text-align: center;
            box-shadow: 0 10px 30px -10px black;
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10000;
            transform: translateY(100px);
            transition: transform 0.3s ease;
            max-width: 360px;
            margin: 0 auto;
            font-size: 14px;
        }
        
        .toast.show {
            transform: translateY(0);
        }
        
        /* Image Modal */
        .image-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }
        
        .image-modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 16px;
        }
        
        /* Message Status */
        .message-status {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 4px;
            display: inline-flex;
            align-items: center;
        }
        
        .message-status.delivered, .message-status.read {
            color: #3b82f6;
        }
        
        .message-time {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.3);
            margin-right: 4px;
        }
        
        /* Hide scrollbar for chat window on mobile */
        @media (max-width: 1023px) {
            #chat-window::-webkit-scrollbar {
                width: 2px;
            }
        }
    </style>
</head>
<body class="bg-gradient" oncontextmenu="return false">

    <!-- Setup Screen -->
    <div id="setup-screen" class="fixed inset-0 z-50 flex items-center justify-center p-3 safe-top safe-bottom">
        <div class="setup-container">
            <div class="text-center mb-6">
                <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent mb-1">DarkFish</h1>

            <div class="space-y-5">

                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>

                        </svg>

                </div>
                <input type="file" id="pfp-input" class="hidden" accept="image/*">
                
                <!-- Username -->
                <input type="text" id="username" placeholder="Enter your nickname..." class="premium-input text-center font-semibold">
                
                <!-- Buttons -->
                <div class="space-y-3">
                    <button onclick="createRoom()" class="premium-button w-full">

                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </label>
                    
                    <form id="chat-form" class="flex-1 flex items-center">
                        <input type="text" id="msg-input" placeholder="Type a message..." class="message-input" autocomplete="off">
                        <button type="submit" class="send-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Modal -->
    <div id="request-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="text-center">
                <div class="w-16 h-16 mx-auto mb-4 bg-blue-500/20 rounded-2xl flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <h3 class="text-lg font-bold mb-1">Friend Request</h3>
                <p class="text-xs text-slate-400 mb-4">
                    <span id="request-name" class="text-white font-semibold"></span> wants to chat
                </p>
                <div class="flex gap-2">
                    <button id="accept-btn" class="premium-button flex-1 py-2.5 text-sm">Accept</button>
                    <button id="reject-btn" class="premium-button-secondary flex-1 py-2.5 text-sm">Decline</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="image-modal hidden" onclick="this.classList.add('hidden')">
        <img id="fullscreen-image" src="" alt="Full screen">
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // Configuration
        let peer, conns = new Map();
        let currentConn = null;
        let myId = null;
        let myName = '';
        let myPfp = null;
        let pendingRequests = new Map();
        let messageStatus = new Map();
        
        const STORAGE_KEY = 'darkfish_chats';
        const ACCEPTED_PEERS_KEY = 'darkfish_peers';
        const PFP_KEY = 'darkfish_pfp';
        
        // Initialize
        function init() {
            const savedPfp = localStorage.getItem(PFP_KEY);
            if (savedPfp) {
                myPfp = savedPfp;
                document.getElementById('pfp-preview').src = myPfp;
            } else {
                const seed = Math.random().toString(36).substring(7);
                myPfp = `https://api.dicebear.com/7.x/avataaars-neutral/svg?seed=${seed}`;
                document.getElementById('pfp-preview').src = myPfp;
            }
            
            const savedName = localStorage.getItem('darkfish_name');
            if (savedName) {
                document.getElementById('username').value = savedName;
            }
        }
        
        // UI Functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('active');
        }
        
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            toast.style.background = type === 'error' ? '#dc2626' : '#2563eb';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // Setup Screen
        document.getElementById('pfp-input').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    myPfp = ev.target.result;
                    document.getElementById('pfp-preview').src = myPfp;
                    localStorage.setItem(PFP_KEY, myPfp);
                };
                reader.readAsDataURL(file);
            }
        };
        
        function createRoom() {
            myName = document.getElementById('username').value.trim();
            if (!myName) {
                showToast('Please enter a nickname', 'error');
                return;
            }
            localStorage.setItem('darkfish_name', myName);
            localStorage.setItem(PFP_KEY, myPfp);
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            initPeer();
        }
        
        function joinRoom() {
            const targetId = document.getElementById('join-id').value.trim();
            if (!targetId) {
                showToast('Please enter a Peer ID', 'error');
                return;
            }
            
            myName = document.getElementById('username').value.trim();
            if (!myName) {
                showToast('Please enter a nickname', 'error');
                return;
            }
            
            localStorage.setItem('darkfish_name', myName);
            localStorage.setItem(PFP_KEY, myPfp);
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            initPeer(targetId);
        }
        
        // PeerJS Init
        function initPeer(connectToId = null) {
            peer = new Peer();
            
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('my-id-display').innerText = id;
                showToast('Your ID: ' + id.substring(0, 8) + '...');
                
                const savedPeers = JSON.parse(localStorage.getItem(ACCEPTED_PEERS_KEY) || '[]');
                savedPeers.forEach(peerId => {
                    if (peerId !== id) {
                        setTimeout(() => connectToPeer(peerId), 1000);
                    }
                });
                
                if (connectToId) {
                    setTimeout(() => connectToPeer(connectToId), 1000);
                }
            });
            
            peer.on('connection', (conn) => {
                setupConnection(conn, false);
            });
            
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                showToast('Connection error', 'error');
            });
        }
        
        function connectToPeer(peerId) {
            if (conns.has(peerId)) {
                showToast('Already connected');
                return;
            }
            
            const conn = peer.connect(peerId, {
                metadata: {
                    name: myName,
                    pfp: myPfp,
                    request: true
                }
            });
            
            setupConnection(conn, true);
        }
        
        function addPeer() {
            const peerId = document.getElementById('add-peer-id').value.trim();
            if (!peerId) {
                showToast('Please enter a Peer ID', 'error');
                return;
            }
            connectToPeer(peerId);
            document.getElementById('add-peer-id').value = '';
            closeSidebar();
        }
        
        // Connection Setup
        function setupConnection(conn, isInitiator) {
            const peerId = conn.peer;
            
            conns.set(peerId, {
                conn: conn,
                accepted: false,
                name: isInitiator ? 'Connecting...' : 'Incoming Request',
                pfp: 'https://api.dicebear.com/7.x/avataaars-neutral/svg?seed=pending',
                typingTimeout: null
            });
            
            renderPeerCard(peerId);
            
            conn.on('open', () => {
                const savedPeers = JSON.parse(localStorage.getItem(ACCEPTED_PEERS_KEY) || '[]');
                
                if (savedPeers.includes(peerId)) {
                    autoAcceptPeer(peerId, conn.metadata?.name, conn.metadata?.pfp);
                } else if (!isInitiator && conn.metadata?.request) {
                    showRequestModal(peerId, conn.metadata.name, conn.metadata.pfp);
                } else if (isInitiator) {
                    updatePeerStatus(peerId, 'Pending...', 'pending');
                }
            });
            
            conn.on('data', (data) => {
                handleData(peerId, data);
            });
            
            conn.on('close', () => {
                cleanupPeer(peerId);
            });
            
            conn.on('error', () => {
                cleanupPeer(peerId);
            });
        }
        
        function autoAcceptPeer(peerId, name, pfp) {
            const entry = conns.get(peerId);
            if (!entry) return;
            
            entry.accepted = true;
            entry.name = name || 'Friend';
            entry.pfp = pfp || entry.pfp;
            
            entry.conn.send({
                type: 'accept',
                name: myName,
                pfp: myPfp
            });
            
            updatePeerCard(peerId);
            showToast('Connected to ' + entry.name);
        }
        
        function showRequestModal(peerId, name, pfp) {
            pendingRequests.set(peerId, { name, pfp });
            
            document.getElementById('request-name').innerText = name || 'Someone';
            document.getElementById('request-modal').classList.remove('hidden');
            
            const acceptBtn = document.getElementById('accept-btn');
            const rejectBtn = document.getElementById('reject-btn');
            
            const newAccept = acceptBtn.cloneNode(true);
            const newReject = rejectBtn.cloneNode(true);
            acceptBtn.parentNode.replaceChild(newAccept, acceptBtn);
            rejectBtn.parentNode.replaceChild(newReject, rejectBtn);
            
            newAccept.onclick = () => {
                acceptPeer(peerId, name, pfp);
                document.getElementById('request-modal').classList.add('hidden');
                pendingRequests.delete(peerId);
            };
            
            newReject.onclick = () => {
                const entry = conns.get(peerId);
                if (entry) entry.conn.close();
                conns.delete(peerId);
                removePeerCard(peerId);
                document.getElementById('request-modal').classList.add('hidden');
                pendingRequests.delete(peerId);
            };
        }
        
        function acceptPeer(peerId, name, pfp) {
            const entry = conns.get(peerId);
            if (!entry) return;
            
            entry.accepted = true;
            entry.name = name || 'Friend';
            entry.pfp = pfp || entry.pfp;
            
            entry.conn.send({
                type: 'accept',
                name: myName,
                pfp: myPfp
            });
            
            const saved = JSON.parse(localStorage.getItem(ACCEPTED_PEERS_KEY) || '[]');
            if (!saved.includes(peerId)) {
                saved.push(peerId);
                localStorage.setItem(ACCEPTED_PEERS_KEY, JSON.stringify(saved));
            }
            
            updatePeerCard(peerId);
            selectChat(peerId);
            showToast('Connected to ' + entry.name);
        }
        
        // Data Handling
        function handleData(peerId, data) {
            const entry = conns.get(peerId);
            if (!entry) return;
            
            if (data.type === 'accept') {
                entry.accepted = true;
                entry.name = data.name || entry.name;
                entry.pfp = data.pfp || entry.pfp;
                
                const saved = JSON.parse(localStorage.getItem(ACCEPTED_PEERS_KEY) || '[]');
                if (!saved.includes(peerId)) {
                    saved.push(peerId);
                    localStorage.setItem(ACCEPTED_PEERS_KEY, JSON.stringify(saved));
                }
                
                updatePeerCard(peerId);
                
                if (!currentConn) {
                    selectChat(peerId);
                }
                
                showToast('Connected to ' + entry.name);
                
            } else if (data.type === 'typing') {
                if (currentConn?.peer === peerId) {
                    document.getElementById('typing-indicator').classList.remove('hidden');
                    clearTimeout(entry.typingTimeout);
                    entry.typingTimeout = setTimeout(() => {
                        document.getElementById('typing-indicator').classList.add('hidden');
                    }, 2000);
                }
                
            } else if (data.type === 'text') {
                if (entry.accepted) {
                    displayMessage(peerId, data.text, 'theirs', data.messageId);
                    
                    if (currentConn?.peer === peerId) {
                        entry.conn.send({
                            type: 'read',
                            messageId: data.messageId
                        });
                    }
                }
                
            } else if (data.type === 'file') {
                if (entry.accepted) {
                    displayFileMessage(peerId, data, 'theirs', data.messageId);
                    
                    if (currentConn?.peer === peerId) {
                        entry.conn.send({
                            type: 'read',
                            messageId: data.messageId
                        });
                    }
                }
                
            } else if (data.type === 'delivered') {
                updateMessageStatus(data.messageId, 'delivered');
                
            } else if (data.type === 'read') {
                updateMessageStatus(data.messageId, 'read');
            }
        }
        
        // Messaging
        document.getElementById('chat-form').onsubmit = function(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            
            if (!text || !currentConn) {
                showToast('No chat selected', 'error');
                return;
            }
            
            const messageId = Date.now() + '-' + Math.random().toString(36).substr(2, 5);
            
            currentConn.send({
                type: 'text',
                text: text,
                messageId: messageId
            });
            
            displayMessage(currentConn.peer, text, 'mine', messageId);
            input.value = '';
        };
        
        // Enter key for sending
        document.getElementById('msg-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chat-form').dispatchEvent(new Event('submit'));
            }
        });
        
        document.getElementById('msg-input').oninput = function() {
            if (currentConn) {
                currentConn.send({ type: 'typing' });
            }
        };
        
        document.getElementById('file-input').onchange = function(e) {
            const file = e.target.files[0];
            if (!file || !currentConn) return;
            
            const reader = new FileReader();
            reader.onload = function(ev) {
                const messageId = Date.now() + '-' + Math.random().toString(36).substr(2, 5);
                const data = {
                    type: 'file',
                    fileData: ev.target.result,
                    fileType: file.type,
                    fileName: file.name,
                    messageId: messageId
                };
                
                currentConn.send(data);
                displayFileMessage(currentConn.peer, data, 'mine', messageId);
            };
            reader.readAsDataURL(file);
        };
        
        function displayMessage(peerId, text, sender, messageId) {
            const window = document.getElementById('chat-window');
            const placeholder = document.getElementById('chat-placeholder');
            if (placeholder) placeholder.style.display = 'none';
            
            const div = document.createElement('div');
            div.className = `flex ${sender === 'mine' ? 'justify-end' : 'justify-start'} mb-2`;
            div.id = `msg-${messageId}`;
            
            const bubble = document.createElement('div');
            bubble.className = sender === 'mine' ? 'bubble-mine' : 'bubble-theirs';
            
            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            bubble.appendChild(textDiv);
            
            if (sender === 'mine') {
                const statusDiv = document.createElement('div');
                statusDiv.className = 'flex justify-end items-center mt-0.5';
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'message-time';
                const now = new Date();
                timeSpan.textContent = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                
                const statusSpan = document.createElement('span');
                statusSpan.className = 'message-status';
                statusSpan.id = `status-${messageId}`;
                statusSpan.innerHTML = '✓';
                
                statusDiv.appendChild(timeSpan);
                statusDiv.appendChild(statusSpan);
                bubble.appendChild(statusDiv);
                
                messageStatus.set(messageId, 'sent');
            }
            
            div.appendChild(bubble);
            window.appendChild(div);
            window.scrollTop = window.scrollHeight;
            
            saveMessage(peerId, { text, sender, type: 'text', timestamp: Date.now(), messageId });
            
            if (sender === 'theirs' && currentConn?.peer === peerId) {
                const entry = conns.get(peerId);
                if (entry) {
                    entry.conn.send({ type: 'delivered', messageId: messageId });
                }
            }
        }
        
        function displayFileMessage(peerId, data, sender, messageId) {
            const window = document.getElementById('chat-window');
            const placeholder = document.getElementById('chat-placeholder');
            if (placeholder) placeholder.style.display = 'none';
            
            const div = document.createElement('div');
            div.className = `flex ${sender === 'mine' ? 'justify-end' : 'justify-start'} mb-2`;
            div.id = `msg-${messageId}`;
            
            let content;
            if (data.fileType?.startsWith('image/')) {
                content = document.createElement('img');
                content.src = data.fileData;
                content.className = 'msg-image';
                content.onclick = () => showFullscreenImage(data.fileData);
            } else if (data.fileType?.startsWith('video/')) {
                content = document.createElement('video');
                content.src = data.fileData;
                content.controls = true;
                content.className = 'msg-image max-w-[200px] rounded-xl';
            } else {
                content = document.createElement('a');
                content.href = data.fileData;
                content.download = data.fileName || 'file';
                content.textContent = '📎 ' + (data.fileName || 'Download');
                content.className = 'glass-light px-4 py-2.5 rounded-xl text-blue-400 text-xs inline-block';
            }
            
            if (sender === 'mine') {
                const container = document.createElement('div');
                container.className = 'flex flex-col';
                
                const fileDiv = document.createElement('div');
                fileDiv.appendChild(content);
                container.appendChild(fileDiv);
                
                const statusDiv = document.createElement('div');
                statusDiv.className = 'flex justify-end items-center mt-0.5';
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'message-time';
                const now = new Date();
                timeSpan.textContent = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                
                const statusSpan = document.createElement('span');
                statusSpan.className = 'message-status';
                statusSpan.id = `status-${messageId}`;
                statusSpan.innerHTML = '✓';
                
                statusDiv.appendChild(timeSpan);
                statusDiv.appendChild(statusSpan);
                container.appendChild(statusDiv);
                
                div.appendChild(container);
                messageStatus.set(messageId, 'sent');
            } else {
                div.appendChild(content);
            }
            
            window.appendChild(div);
            window.scrollTop = window.scrollHeight;
            
            saveMessage(peerId, { ...data, sender, type: 'file', timestamp: Date.now(), messageId });
            
            if (sender === 'theirs' && currentConn?.peer === peerId) {
                const entry = conns.get(peerId);
                if (entry) {
                    entry.conn.send({ type: 'delivered', messageId: messageId });
                }
            }
        }
        
        function updateMessageStatus(messageId, status) {
            const statusElement = document.getElementById(`status-${messageId}`);
            if (statusElement) {
                statusElement.className = `message-status ${status}`;
                if (status === 'delivered') {
                    statusElement.innerHTML = '✓✓';
                } else if (status === 'read') {
                    statusElement.innerHTML = '✓✓';
                }
                messageStatus.set(messageId, status);
            }
        }
        
        function showFullscreenImage(src) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('fullscreen-image');
            img.src = src;
            modal.classList.remove('hidden');
        }
        
        // Chat Management
        function selectChat(peerId) {
            const entry = conns.get(peerId);
            if (!entry || !entry.accepted) {
                showToast('Cannot start chat - not accepted yet', 'error');
                return;
            }
            
            currentConn = entry.conn;
            
            document.getElementById('partner-display').innerText = entry.name;
            document.getElementById('partner-pfp').src = entry.pfp;
            document.getElementById('status-dot').className = 'status-dot status-online';
            document.getElementById('status-text').innerText = 'Online';
            
            document.querySelectorAll('.peer-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`peer-card-${peerId}`)?.classList.add('active');
            
            document.getElementById('chat-window').innerHTML = '';
            document.getElementById('chat-placeholder').style.display = 'flex';
            
            loadMessages(peerId);
            closeSidebar();
        }
        
        function updatePeerStatus(peerId, status, type) {
            const card = document.getElementById(`peer-card-${peerId}`);
            if (!card) return;
            
            const statusEl = card.querySelector('.peer-status');
            if (statusEl) {
                statusEl.innerText = status;
                statusEl.className = `text-xs peer-status ${type === 'pending' ? 'text-yellow-500' : 'text-slate-500'}`;
            }
        }
        
        // Peer Card Management
        function renderPeerCard(peerId) {
            if (document.getElementById(`peer-card-${peerId}`)) return;
            
            const entry = conns.get(peerId);
            const list = document.getElementById('peer-list');
            
            const card = document.createElement('div');
            card.id = `peer-card-${peerId}`;
            card.className = `peer-card ${entry.accepted ? '' : 'opacity-60'}`;
            card.onclick = () => selectChat(peerId);
            
            card.innerHTML = `
                <img src="${entry.pfp}" class="peer-avatar">
                <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-white text-sm truncate">${entry.name}</h4>
                    <div class="flex items-center gap-1.5 mt-1">
                        <span class="status-dot ${entry.accepted ? 'status-online' : 'status-offline'}"></span>
                        <span class="text-xs peer-status ${entry.accepted ? 'text-green-500' : 'text-yellow-500'}">${entry.accepted ? 'Connected' : 'Pending...'}</span>
                    </div>
                </div>
            `;
            
            list.appendChild(card);
        }
        
        function updatePeerCard(peerId) {
            const card = document.getElementById(`peer-card-${peerId}`);
            const entry = conns.get(peerId);
            if (!card || !entry) return;
            
            card.querySelector('img').src = entry.pfp;
            card.querySelector('h4').innerText = entry.name;
            card.classList.toggle('opacity-60', !entry.accepted);
            
            const statusDot = card.querySelector('.status-dot');
            statusDot.className = `status-dot ${entry.accepted ? 'status-online' : 'status-offline'}`;
            
            const statusText = card.querySelector('.peer-status');
            statusText.innerText = entry.accepted ? 'Connected' : 'Pending...';
            statusText.className = `text-xs peer-status ${entry.accepted ? 'text-green-500' : 'text-yellow-500'}`;
        }
        
        function removePeerCard(peerId) {
            document.getElementById(`peer-card-${peerId}`)?.remove();
        }
        
        function cleanupPeer(peerId) {
            conns.delete(peerId);
            removePeerCard(peerId);
            
            if (currentConn?.peer === peerId) {
                currentConn = null;
                document.getElementById('partner-display').innerText = 'Select a chat';
                document.getElementById('partner-pfp').src = 'https://api.dicebear.com/7.x/avataaars-neutral/svg?seed=default';
                document.getElementById('status-dot').className = 'status-dot status-offline';
                document.getElementById('status-text').innerText = 'Disconnected';
            }
        }
        
        // Storage
        function saveMessage(peerId, msg) {
            try {
                const storage = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                if (!storage[peerId]) storage[peerId] = [];
                storage[peerId].push(msg);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(storage));
            } catch (e) {
                console.error('Failed to save message:', e);
            }
        }
        
        function loadMessages(peerId) {
            try {
                const storage = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                const msgs = storage[peerId] || [];
                msgs.forEach(msg => {
                    if (msg.type === 'text') {
                        displayMessage(peerId, msg.text, msg.sender, msg.messageId);
                    } else if (msg.type === 'file') {
                        displayFileMessage(peerId, msg, msg.sender, msg.messageId);
                    }
                });
            } catch (e) {
                console.error('Failed to load messages:', e);
            }
        }
        
        // Utilities
        function copyID() {
            if (myId) {
                navigator.clipboard.writeText(myId);
                showToast('ID copied!');
            }
        }
        
        // Close modals on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('request-modal').classList.add('hidden');
                document.getElementById('image-modal').classList.add('hidden');
                closeSidebar();
            }
        });
        
        // Initialize
        init();
    </script>
</body>
</html>
